# Production stack for one VPS (PLAN.md section 2, "Infrastructure").
#
#   cd deploy && cp env.production.example .env   # then fill it in
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only Caddy is reachable from the internet (ports 80 and 443). Postgres,
# Redis, the API and the worker talk on the private compose network.

name: pennywise

# Container logs (they include IP addresses) rotate at 5 x 20 MB, which
# keeps roughly two weeks: the privacy policy relies on this.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-app-env: &app-env
  APP_ENV: production
  DATABASE_URL: postgres://pennywise:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/pennywise?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
  GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
  LINK_BASE: ${LINK_BASE:-pennywise://}
  MAILER: ${MAILER:?set MAILER}
  FX_API_URL: ${FX_API_URL:-https://api.frankfurter.dev/v1}
  R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
  R2_BUCKET: ${R2_BUCKET:-}

services:
  caddy:
    logging: *logging
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy_data:/data # certificates: keep this volume
      - caddy_config:/config
    depends_on:
      api: { condition: service_started }

  postgres:
    logging: *logging
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pennywise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: pennywise
    # Tuned for a 4 GB VPS shared with the other services.
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=100
      - -c
      - wal_compression=on
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pennywise -d pennywise"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    logging: *logging
    image: redis:8-alpine
    restart: unless-stopped
    # AOF so queued jobs survive a restart; noeviction so jobs are never
    # dropped to make room (writes fail loudly instead).
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "384mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    logging: *logging
    build: ../backend
    entrypoint: ["/app/migrate", "up"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }

  api:
    logging: *logging
    build: ../backend
    restart: unless-stopped
    entrypoint: ["/app/api"]
    environment:
      <<: *app-env
      HTTP_ADDR: ":8080"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    logging: *logging
    build: ../backend
    restart: unless-stopped
    entrypoint: ["/app/worker"]
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
