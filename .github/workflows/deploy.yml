name: deploy-config

# Checks the production files (deploy/) without deploying anything.
on:
  push:
    branches: [main]
    paths: ["deploy/**", ".github/workflows/deploy.yml"]
  pull_request:
    paths: ["deploy/**", ".github/workflows/deploy.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy
    env:
      # Placeholders: only the file syntax is checked.
      API_DOMAIN: api.example.com
      ACME_EMAIL: ops@example.com
      POSTGRES_PASSWORD: placeholder
      JWT_SECRET: placeholder
      MAILER: placeholder
    steps:
      - uses: actions/checkout@v4
      - name: Caddyfile is valid
        run: >
          docker run --rm -e API_DOMAIN -e ACME_EMAIL
          -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Compose file is valid
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Backup script
        run: |
          bash -n backup.sh
          shellcheck backup.sh
